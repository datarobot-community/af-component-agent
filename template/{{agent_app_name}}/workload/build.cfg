# setuptools command options, read only by workload/run_server.sh through the
# DIST_EXTRA_CONFIG environment variable. Deliberately not the project's own
# setup.cfg: this applies to the Workload API C2W container start and nothing
# else, so local development and the Custom Models build are unaffected.
#
# The application root is read-only at run time, but setuptools writes into the
# source tree by default -- egg_info metadata next to pyproject.toml, plus a
# staged copy of the package under build/ -- so installing the agent there
# fails with "could not create 'agent.egg-info': Permission denied". Both
# destinations are redirected to a writable temporary directory instead.
# run_server.sh creates that directory; setuptools requires egg_base to exist
# already and will not create it.
[egg_info]
egg_base = /tmp/agent-build

[build]
build_base = /tmp/agent-build/build
