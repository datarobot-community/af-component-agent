# questions
agent_app_name:
  type: str
  default: "agent"
  help: "The name/folder of your Agent Deployment. Must be a Python-friendly name (letters, numbers, underscores only, no spaces)"
  validator: >-
    {% if not agent_app_name %}ERROR: Agent app name cannot be empty
    {% elif ' ' in agent_app_name %}ERROR: Agent app name cannot contain spaces
    {% elif not agent_app_name.isidentifier() %}ERROR: Agent app name must be a valid Python identifier (letters, numbers, underscores only, cannot start with number)
    {% endif %}

agent_app_name_file:
  type: str
  default: "{{agent_app_name|lower|replace('-','_')}}"
  when: false

use_low_code_interface:
  type: bool
  help: "Do you want to use low-code YAML-based configuration (i.e. NeMo Agent Toolkit) for your agent? (default: no)"
  default: no

# Provider selection lives in af-component-memory, not here. This only controls
# whether the agent looks for a memory component's runtime parameters; which
# backend those parameters describe is that component's business.
use_agent_memory:
  type: str
  help: "Consume agent memory from an af-component-memory component?"
  default: none
  choices:
    # Quoted: bare No/Yes are YAML 1.1 booleans and would become False/True labels.
    "No": none
    "Yes (requires the af-component-memory component)": memory_component

agent_template_framework:
  type: str
  default: |-
    {% if use_low_code_interface -%}
      nat
    {%- else -%}
      base
    {%- endif %}
  help: "Choose the agentic framework template to start with:"
  choices:
    Base: base
    CrewAI: crewai
    LangGraph: langgraph
    LlamaIndex: llamaindex
    "NeMo Agent Toolkit (NAT)": nat
  when: "{{not use_low_code_interface}}"

base_answers_file:
  type: str
  default: ".datarobot/answers/base.yml"
  help: "Path to the base component answers file (must contain '.datarobot/answers')"
  validator: >-
    {% if not base_answers_file %}ERROR: Base answers file path cannot be empty
    {% elif '.datarobot/answers' not in base_answers_file %}ERROR: Base answers file must contain '.datarobot/answers' in the path
    {% endif %}

llm_answers_file:
  type: str
  default: ".datarobot/answers/llm-llm.yml"
  help: "Path to the llm component answers file (must contain '.datarobot/answers')"
  validator: >-
    {% if not llm_answers_file %}ERROR: LLM answers file path cannot be empty
    {% elif '.datarobot/answers' not in llm_answers_file %}ERROR: LLM answers file must contain '.datarobot/answers' in the path
    {% endif %}

# Re-use answers from the components this agent depends on.
_external_data:
  base: "{{ base_answers_file }}"
  llm: "{{ llm_answers_file }}"

_subdirectory: template
_answers_file: ".datarobot/answers/agent-{{ agent_app_name }}.yml"
_exclude:
    - "*.j2"
    - "*_templates"
    # NAT agents are defined declaratively in workflow.yaml, not in code, so
    # there is no agent implementation module to generate.
    - "{% if agent_template_framework == 'nat' %}myagent.py{% endif %}"

_migrations:
  # Migrate legacy agent implementation into the new package layout.
  #
  # Why 2 steps?
  # - On update, the template may delete `agentic_workflow/agent.py`.
  # - We therefore snapshot it in the "before" stage, then overwrite the
  #   newly-rendered `agent/myagent.py` in the "after" stage.
  #
  # This only triggers for legacy projects that still have `agentic_workflow/agent.py`
  # and do not already have `agent/myagent.py` before the update starts.
  # source: https://copier.readthedocs.io/en/stable/configuring/#migrations
  - version: "11.5.9"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        # NOTE: During the "before" stage, some answer variables may not be
        # available for templating yet, so we discover app folders using globs.
        #
        # Typical layout:
        #   <app_name>/agentic_workflow/agent.py
        for SRC in */agentic_workflow/agent.py; do
          [ -f "$SRC" ] || continue
          APP="${SRC%%/agentic_workflow/agent.py}"
          DST="$APP/agent/myagent.py"
          TMP_DIR="$APP/.copier_migration_tmp"
          TMP_FILE="$TMP_DIR/agent.py"

          if [ ! -f "$DST" ]; then
            mkdir -p "$TMP_DIR"
            cp "$SRC" "$TMP_FILE"
          fi
        done
    when: "{{ _stage == 'before' and _copier_operation == 'update' }}"
  - version: "11.5.9"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        for TMP_FILE in */.copier_migration_tmp/agent.py; do
          [ -f "$TMP_FILE" ] || continue
          APP="${TMP_FILE%%/.copier_migration_tmp/agent.py}"
          DST="$APP/agent/myagent.py"

          mkdir -p "$APP/agent"
          cp "$TMP_FILE" "$DST"
          rm -rf "$APP/.copier_migration_tmp"
        done
    when: "{{ _stage == 'after' and _copier_operation == 'update' }}"
  # Migrate legacy boolean memory answers to the current provider choice.
  #
  # `use_agent_memory` used to be a bool, so older answers can contain
  # yes/no or true/false. The current question is a string choice where the
  # no-memory provider is stored as `none`.
  - version: "11.8.28"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        for ANSWERS_FILE in .datarobot/answers/agent-*.yml; do
          [ -f "$ANSWERS_FILE" ] || continue
          python3 - "$ANSWERS_FILE" <<'PY'
        from pathlib import Path
        import re
        import sys

        answers_file = Path(sys.argv[1])
        text = answers_file.read_text(encoding="utf-8")
        legacy_bool_answer = re.compile(
            r"^(\s*use_agent_memory:\s*)(['\"]?)(?:yes|no|true|false)\2(\s*(?:#.*)?)$",
            re.IGNORECASE | re.MULTILINE,
        )
        updated = legacy_bool_answer.sub(r"\1none\3", text)
        if updated != text:
            answers_file.write_text(updated, encoding="utf-8")
        PY
        done
    when: "{{ _stage == 'before' and _copier_operation == 'update' }}"
  # Move workflow.yaml from agent/ to the app root (DRAgent default config path).
  #
  # Why 2 steps?
  # - On update, the template stops rendering agent/workflow.yaml.
  # - We snapshot the legacy file in "before", then restore it at the new path
  #   in "after" so user customizations are preserved.
  #
  # Only runs for projects that still have agent/workflow.yaml and do not yet
  # have workflow.yaml at the app root before the update starts.
  - version: "11.9.10"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        for SRC in */agent/workflow.yaml; do
          [ -f "$SRC" ] || continue
          APP="${SRC%%/agent/workflow.yaml}"
          DST="$APP/workflow.yaml"
          TMP_DIR="$APP/.copier_migration_tmp_workflow"
          TMP_FILE="$TMP_DIR/workflow.yaml"

          if [ ! -f "$DST" ]; then
            mkdir -p "$TMP_DIR"
            cp "$SRC" "$TMP_FILE"
          fi
        done
    when: "{{ _stage == 'before' and _copier_operation == 'update' }}"
  - version: "11.9.10"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        for TMP_FILE in */.copier_migration_tmp_workflow/workflow.yaml; do
          [ -f "$TMP_FILE" ] || continue
          APP="${TMP_FILE%%/.copier_migration_tmp_workflow/workflow.yaml}"
          DST="$APP/workflow.yaml"
          SRC="$APP/agent/workflow.yaml"

          cp "$TMP_FILE" "$DST"
          rm -f "$SRC" "$TMP_FILE"
          rm -rf "$APP/.copier_migration_tmp_workflow"
        done
    when: "{{ _stage == 'after' and _copier_operation == 'update' }}"
  # Preserve the pre-split agent infra module.
  #
  # The agent's Pulumi infra used to be one module, `infra/infra/<app>.py`.
  # It is now an entry router plus `infra/infra/<app>_infra/{base,deployment,
  # workload}.py`, so the update rewrites that file almost entirely and copier
  # 3-way-merges it. The conflict is unavoidable -- deleting the file here
  # first does not prevent it, since copier reconstructs the merge from its
  # own recorded state -- and it surfaces as one small, routine-looking hunk
  # that does not show local edits. A project that customized the module can
  # therefore resolve in favour of the new router and silently lose its
  # changes, because the code it patched now lives in base.py / deployment.py.
  #
  # There is no mechanical way to replay arbitrary local edits into the new
  # layout, so keep a pristine copy of the old module beside it and say where
  # the code went. Detection is by content, not filename, so this is
  # idempotent and skips projects already on the new layout: only the
  # pre-split module defines the Custom Models constants at module level.
  # `infra/infra/*.py` is not recursive, so the new
  # `<app>_infra/deployment.py` is never matched.
  - version: "11.11.48"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        for SRC in infra/infra/*.py; do
          [ -f "$SRC" ] || continue
          grep -q "DEFAULT_AGENT_RESOURCE_BUNDLE_ID" "$SRC" || continue

          BACKUP="$SRC.pre-split.bak"
          if [ -e "$BACKUP" ]; then
            continue
          fi
          cp "$SRC" "$BACKUP"

          MODULE="$(basename "$SRC" .py)"
          echo "" >&2
          echo "NOTE: $SRC is now only an entry router; its logic moved into" >&2
          echo "      ${MODULE}_infra/{base,deployment,workload}.py." >&2
          echo "      A copy of your current version was saved as $BACKUP." >&2
          echo "      If you never edited that file, resolve the merge in favour of the new" >&2
          echo "      version and delete the backup." >&2
          echo "      If you did edit it, port those changes into ${MODULE}_infra/base.py or" >&2
          echo "      ${MODULE}_infra/deployment.py -- edits left in the router have no effect." >&2
          echo "      See docs/agent/migration-infra-split.md." >&2
          echo "" >&2
        done
    when: "{{ _stage == 'before' and _copier_operation == 'update' }}"
  # Migrate provider-specific memory answers to the memory-component choice.
  #
  # Memory providers moved out of this component into af-component-memory, so
  # `mem0` / `datarobot_memory_service` are no longer valid answers here. Both
  # become `memory_component`, which only means "look for a memory component's
  # runtime parameters". Copier cannot add that component for us, so the note
  # below tells the user to run `dr component add af-component-memory`.
  #
  # Answers already on `none` or `memory_component` are left alone, so this is
  # idempotent.
  - version: "11.12.0"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        MIGRATED=""
        for ANSWERS_FILE in .datarobot/answers/agent-*.yml; do
          [ -f "$ANSWERS_FILE" ] || continue
          PROVIDER="$(python3 - "$ANSWERS_FILE" <<'PY'
        from pathlib import Path
        import re
        import sys

        answers_file = Path(sys.argv[1])
        text = answers_file.read_text(encoding="utf-8")
        provider_answer = re.compile(
            r"^(\s*use_agent_memory:\s*)(['\"]?)(mem0|datarobot_memory_service)\2(\s*(?:#.*)?)$",
            re.MULTILINE,
        )
        match = provider_answer.search(text)
        if match:
            answers_file.write_text(
                provider_answer.sub(r"\1memory_component\4", text), encoding="utf-8"
            )
            print(match.group(3))
        PY
        )"
          [ -n "$PROVIDER" ] && MIGRATED="$MIGRATED $ANSWERS_FILE ($PROVIDER)"
        done
        if [ -n "$MIGRATED" ]; then
          echo "" >&2
          echo "NOTE: agent memory providers moved to af-component-memory." >&2
          echo "      Rewrote use_agent_memory to 'memory_component' in:$MIGRATED" >&2
          echo "" >&2
          echo "      This agent no longer provisions a memory backend. To keep memory" >&2
          echo "      working, add the component and pick the same provider:" >&2
          echo "" >&2
          echo "        dr component add af-component-memory" >&2
          echo "" >&2
          echo "      Provider settings move with it: MEM0_API_KEY and AGENT_MEMORY_*" >&2
          echo "      are read per-instance first (<MEMORY_NAME>_<VAR>), with the" >&2
          echo "      unprefixed names still honoured as a fallback." >&2
          echo "" >&2
          echo "      For datarobot_memory_service, the new component creates its OWN" >&2
          echo "      memory space -- the one this agent used to manage is not reused" >&2
          echo "      and its stored memories do not carry over." >&2
          echo "" >&2
          echo "      See docs/agent/agent-memory.md." >&2
          echo "" >&2
        fi
    when: "{{ _stage == 'before' and _copier_operation == 'update' }}"
