[project]

name = "af-component-agent"
version = "0.1.0"
description = "Application Framework Agent Component"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja-cli>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "backoff>=2.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "datarobot-genai==0.28.3",
    # Keep in step with the version the template pins for rendered apps: the E2E harness
    # drives deployed agents through datarobot_genai.core.cli.
    "datarobot[core]>=3.18.0,<4.0.0",
]

[tool.uv]
required-version = ">=0.7.0"
# cve-sync:begin
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "authlib>=1.7.1",
    "banks>=2.4.2",
    "bleach>=6.4.0",
    "click>=8.3.3",
    "cryptography>=50.0.0",
    "h2>=4.4.1",
    "idna>=3.15",
    "joserfc>=1.6.8",
    "json-repair>=0.60.1",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.5.10",
    "langchain>=1.3.9",
    "langchain-classic>=1.0.7",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint>=4.1.1",
    "langsmith>=0.8.18",
    "mcp>=1.28.1",
    "mistune>=3.3.0",
    "nltk>=3.10.0",
    "notebook>=7.5.6",
    "openai>=2.30.0",
    "pdfminer.six>=20251230",
    "pillow>=12.3.0",
    "pip>=26.2",
    "pyarrow>=23.0.1",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "PyJWT>=2.13.0",
    "pymdown-extensions>=11.0.1",
    "pypdf>=6.15.0",
    "pytest>=9.0.3",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "soupsieve>=2.8.4",
    "starlette>=1.3.1",
    "tornado>=6.5.7",
    "transformers>=5.5.0",
    "urllib3>=2.7.0",
]
# cve-sync:end

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that require external services (DataRobot, Pulumi, etc.)",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "docker_context",
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = ["I001"] # I001 is not applied appropriately in template

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
