---
# https://taskfile.dev
version: '3'
env :
  RENDER_DIR: .rendered

includes:
  # Vendored from datarobot-oss/cve-sync (taskfiles/cve-sync.yml). Only the
  # taskfile is vendored; the tool and the CVE policy are fetched at run time, so
  # this file does not need updating when a floor changes. Not flattened, so the
  # tasks are namespaced as `task cve-sync:<name>`.
  #
  # `task cve-sync:check-templates` is the one that matters most here: this repo's
  # real dependency surface is the pyproject.toml.jinja and the pre-baked locks
  # generated from it, and the plain `check` task cannot see either.
  cve-sync:
    taskfile: .taskfiles/cve-sync.yml

tasks:
  default:
    desc: "Show all available tasks"
    cmds:
      - task --list
    silent: true
  install:
    desc: "Install development dependencies for all agents into .venv_dev directory"
    cmds:
      - echo "Installing development dependencies for all agents"
      - uv sync --all-extras
      - mv pyproject.toml pyproject.toml.bak
      - uv run jinja -D agent_app_name DockerContext -D agent_template_framework docker 'template/{{ "{{agent_app_name}}" }}/pyproject.toml.jinja' -o pyproject.toml
      - UV_PROJECT_ENVIRONMENT=.venv_dev uv sync --all-extras
      - rm pyproject.toml
      - mv pyproject.toml.bak pyproject.toml
      - uv sync --all-extras

  install-e2e:
    desc: "Install dependencies needed to run E2E tests (prefers active venv when activated)"
    cmds:
      - echo "Installing E2E dependencies"
      - |
          if [ -n "${VIRTUAL_ENV:-}" ]; then
            uv sync --all-extras --active
          else
            uv sync --all-extras
          fi

  test-e2e:
    desc: "Install + run full deployment E2E"
    cmds:
      - task: install-e2e
      - task: e2e

  test-e2e-workload:
    # Deliberately not folded into `test-e2e`: a real Workload API deploy builds
    # a container image on the platform, and there would be no way to opt out.
    desc: "Install + run Workload API E2E"
    cmds:
      - task: install-e2e
      - task: e2e-workload

  render-template:
    desc: "Render template"
    vars:
      USE_MEMORY: '{{.USE_MEMORY| default "none"}}'
      # The rendered app folder and `[project].name`. Defaults to copier's own
      # default so every existing caller renders exactly where it did before.
      # `update-lock-file` overrides it, and only it: see LOCK_APP_NAME there.
      APP_NAME: '{{.APP_NAME | default "agent"}}'
      AGENT_TEMPLATE_FRAMEWORK: '{{ trimSuffix "_memory" .AGENT }}'
    cmds:
      - echo "Rendering template {{.AGENT}} as {{.APP_NAME}}"
      # Clean up the existing rendered directory except for .venv to speed up rendering and avoid conflict checks
      - cd ./$RENDER_DIR/agent_{{.AGENT}}/ && [ -d . ] && find . -mindepth 1 -maxdepth 1 ! -name '.venv' -exec rm -rf {} + || true
      - mkdir -p ./$RENDER_DIR/agent_{{.AGENT}}/.datarobot/answers/
      - cp ./fixtures/.datarobot/answers/llm-llm.yml ./$RENDER_DIR/agent_{{.AGENT}}/.datarobot/answers/llm-llm.yml
      - uvx copier copy . ./$RENDER_DIR/agent_{{.AGENT}} --defaults --data agent_app_name={{.APP_NAME}} --data agent_template_framework={{.AGENT_TEMPLATE_FRAMEWORK}} --data use_agent_memory={{.USE_MEMORY}} --vcs-ref=HEAD
      - cp ./fixtures/Taskfile.yml ./$RENDER_DIR/agent_{{.AGENT}}/Taskfile.yml
      - mkdir -p ./$RENDER_DIR/agent_{{.AGENT}}/infra/infra
      - cp ./fixtures/infra/Taskfile.yml ./$RENDER_DIR/agent_{{.AGENT}}/infra/Taskfile.yml
      - cp ./fixtures/infra/pyproject.toml ./$RENDER_DIR/agent_{{.AGENT}}/infra/pyproject.toml
      - cp ./fixtures/infra/__init__.py ./$RENDER_DIR/agent_{{.AGENT}}/infra/infra/__init__.py
      - cp ./fixtures/infra/llm.py ./$RENDER_DIR/agent_{{.AGENT}}/infra/infra/llm.py

  render-template-e2e:
    desc: "Render template + inject test scaffolding used by E2E (Taskfiles + minimal infra entrypoint/files)"
    cmds:
      - task: render-template
        vars:
          AGENT: "{{.AGENT}}"
      # Add base component scaffolding used by our tests (Taskfiles + minimal infra entrypoint/files).
      - cp ./fixtures/Taskfile.yml ./$RENDER_DIR/agent_{{.AGENT}}/Taskfile.yml
      - mkdir -p ./$RENDER_DIR/agent_{{.AGENT}}/infra/infra
      - cp ./fixtures/infra/Taskfile.yml ./$RENDER_DIR/agent_{{.AGENT}}/infra/Taskfile.yml
      # Inject minimal infra scaffolding so `pulumi up` can run in this component repo.
      # (In a real AF project this is provided by the base/llm components.)
      - cp ./fixtures/infra/Pulumi.yaml ./$RENDER_DIR/agent_{{.AGENT}}/infra/Pulumi.yaml
      - cp ./fixtures/infra/__main__.py ./$RENDER_DIR/agent_{{.AGENT}}/infra/__main__.py
      - cp ./fixtures/infra/pyproject.toml ./$RENDER_DIR/agent_{{.AGENT}}/infra/pyproject.toml
      - cp ./fixtures/infra/__init__.py ./$RENDER_DIR/agent_{{.AGENT}}/infra/infra/__init__.py
      - cp ./fixtures/infra/llm.py ./$RENDER_DIR/agent_{{.AGENT}}/infra/infra/llm.py

  install-rendered:
    desc: "Install dev"
    cmds:
      - echo "Checking lock file for {{.AGENT}}"
      - uv lock --check --directory $RENDER_DIR/agent_{{.AGENT}}/agent
      - echo "Installing dependencies for {{.AGENT}}"
      - task agent:install --dir $RENDER_DIR/agent_{{.AGENT}}
      - task infra:install --dir $RENDER_DIR/agent_{{.AGENT}}

  render-install:
    desc: "Render template + install dependencies"
    cmds:
      - task: render-template
        vars:
          AGENT: "{{.AGENT}}"
          USE_MEMORY: '{{.USE_MEMORY| default "none"}}'
      - task: install-rendered
        vars:
          AGENT: "{{.AGENT}}"

  docker_update_reqs:
    desc: "Update Docker requirements pyproject.toml from jinja template"
    vars:
      genai_agents_path: "{{.AGENT_PATH}}"
    cmds:
      - |
        if [ -z "{{.AGENT_PATH}}" ]; then
          echo "AGENT_PATH is not set. Please set AGENT_PATH to the path of the genai-agents repository."
          echo "task docker_update_reqs AGENT_PATH=/path/to/datarobot-user-models/public_dropin_environments/python311_genai_agents"
          exit 1
        fi
      - uv run jinja -D agent_app_name DockerContext -D agent_template_framework docker template/{{"{{"}}agent_app_name{{"}}"}}/pyproject.toml.jinja -o {{.AGENT_PATH}}/pyproject.toml
      - cd {{.AGENT_PATH}} && uv lock --no-upgrade && uv sync
      # This command is temporary. It is using pip compile to produce a truncated requirements.txt without dependencies to avoid overloading the HHI installer.
      - cd {{.AGENT_PATH}} && uv pip compile --python=3.11 --python-platform=x86_64-manylinux_2_28 --no-header --no-annotate --no-deps --extra agentic_playground --output-file=requirements.txt pyproject.toml
      # Need to extend support for larger requirements.txt files to enable this.
      # - cd {{.AGENT_PATH}} && uv pip freeze > {{.AGENT_PATH}}/requirements.txt
      # - cat {{.AGENT_PATH}}/requirements.txt

  docker_build_local:
    desc: "Build docker image locally (Check container builds)"
    cmds:
      - cd template/{{"{{"}}agent_app_name{{"}}"}}/docker_context && docker build -f Dockerfile . -t test --platform linux/amd64

  test-agent:
    desc: "Run tests"
    cmds:
      - task: render-install
        vars:
          AGENT: "{{.AGENT}}"
          USE_MEMORY: '{{.USE_MEMORY| default "none"}}'
      - echo "Running tests for {{.AGENT}}"
      - cd $RENDER_DIR/agent_{{.AGENT}} && echo "LLM_DEFAULT_MODEL='datarobot/azure/gpt-5-mini-2025-08-07'" >> .env
      - |
          if [ "{{.SKIP_LINT}}" != "1" ]; then
            task agent:lint-check --dir $RENDER_DIR/agent_{{.AGENT}}
          else
            echo "Skipping lint check for agent: {{.AGENT}} because SKIP_LINT=1"
          fi
      - task agent:test-coverage --dir $RENDER_DIR/agent_{{.AGENT}}
      - |
          if [ "{{.SKIP_INFRA}}" != "1" ]; then
            task infra:lint-check --dir $RENDER_DIR/agent_{{.AGENT}}
            task infra:test-coverage --dir $RENDER_DIR/agent_{{.AGENT}}
          else
            echo "Skipping lint check for agent: {{.AGENT}} because SKIP_INFRA=1"
          fi

  test-base:
    desc: "Run tests for base agent"
    cmds:
      - task: test-agent
        vars:
          AGENT: base
          SKIP_LINT: "{{.SKIP_LINT| default 0}}"
          SKIP_INFRA: "{{.SKIP_INFRA| default 0}}"

  test-memory:
    desc: "Run tests for base agent with Mem0 memory enabled"
    cmds:
      - task: test-agent
        vars:
          AGENT: base_memory
          USE_MEMORY: mem0
          SKIP_LINT: "{{.SKIP_LINT| default 0}}"
          SKIP_INFRA: "{{.SKIP_INFRA| default 0}}"

  test-datarobot-memory:
    desc: "Run tests for base agent with DataRobot memory enabled"
    cmds:
      - task: test-agent
        vars:
          AGENT: base_memory
          USE_MEMORY: datarobot_memory_service
          SKIP_LINT: "{{.SKIP_LINT| default 0}}"
          SKIP_INFRA: "{{.SKIP_INFRA| default 0}}"

  test-nat:
    desc: "Run tests for nat agent"
    cmds:
      - task: test-agent
        vars:
          AGENT: nat
          SKIP_LINT: "{{.SKIP_LINT| default 0}}"
          SKIP_INFRA: "{{.SKIP_INFRA| default 0}}"

  test-crewai:
    desc: "Run tests for crewai agent"
    cmds:
      - task: test-agent
        vars:
          AGENT: crewai
          SKIP_LINT: "{{.SKIP_LINT| default 0}}"
          SKIP_INFRA: "{{.SKIP_INFRA| default 0}}"

  test-langgraph:
    desc: "Run tests for langgraph agent"
    cmds:
      - task: test-agent
        vars:
          AGENT: langgraph
          SKIP_LINT: "{{.SKIP_LINT| default 0}}"
          SKIP_INFRA: "{{.SKIP_INFRA| default 0}}"

  test-llamaindex:
    desc: "Run tests for llamaindex agent"
    cmds:
      - task: test-agent
        vars:
          AGENT: llamaindex
          SKIP_LINT: "{{.SKIP_LINT| default 0}}"
          SKIP_INFRA: "{{.SKIP_INFRA| default 0}}"

  validate-windows-compatibility:
    desc: "Validate that file paths don't contain characters illegal on Windows"
    cmds:
      - cmd: |
          echo "Scanning for Windows-incompatible file names (<>:\"|?*)..."
          total=$(find ./template -type f | wc -l | tr -d ' ')
          failures=$(find ./template -type f | while IFS= read -r f; do
            if echo "$f" | grep -q '[<>:"|?*]'; then
              echo "FAIL: $f" >&2
              echo "$f"
            else
              echo "  ok: $f" >&2
            fi
          done)
          bad=0
          if [ -n "$failures" ]; then
            bad=$(echo "$failures" | wc -l | tr -d ' ')
            echo ""
            echo "Offending files:"
            echo "$failures"
          fi
          echo ""
          echo "Checked $total files, $bad incompatible."
          [ "$bad" -gt 0 ] && exit 1 || true
        platforms: [linux, darwin]

  test:
    desc: "Run tests for all agents"
    cmds:
      - task: validate-windows-compatibility
      - task: test-base
      - task: test-memory
      - task: test-datarobot-memory
      - task: test-crewai
      - task: test-langgraph
      - task: test-llamaindex
      - task: test-nat
      # CLI tests fail because it runs auth-check
      # - task: test-cli
      # - task: test-cli-json
      # - task: test-cli-streaming

  update-lock-file:
    desc: "Regenerate the pre-baked uv.lock for {{.AGENT}} (base, crewai, langgraph, llamaindex)"
    vars:
      # Render under the placeholder name so `uv lock` writes the placeholder into
      # the lock itself and the artifact can be copied out verbatim.
      #
      # This replaces a `sed 's/^name = "agent"$/.../'` over the finished lock.
      # That anchored on a package name, not on the root project, so it would have
      # rewritten any third-party package called `agent` as well -- and `agent` is
      # a real name on PyPI. Nothing is rewritten now, so there is nothing to
      # mis-target.
      #
      # uv normalises `[project].name` when it writes a lock, so the underscore
      # here lands as `af-agent-placeholder` in the file. uv.lock.jinja swaps that
      # exact string for the customer's normalised name.
      LOCK_APP_NAME: af_agent_placeholder
      # The app folder copier renders is named after the app, so this follows
      # LOCK_APP_NAME rather than repeating it.
      LOCK_DIR: '$RENDER_DIR/agent_{{.AGENT}}/{{.LOCK_APP_NAME}}'
    cmds:
      - echo "Updating lock file for {{.AGENT}}"
      - task: render-template
        vars:
          AGENT: "{{.AGENT}}"
          APP_NAME: "{{.LOCK_APP_NAME}}"
          USE_MEMORY: '{{.USE_MEMORY| default "none"}}'
      - |
          if [ "$UPGRADE_LOCK" = "1" ]; then
            uv lock -U --directory {{.LOCK_DIR}}
          else
            uv lock --directory {{.LOCK_DIR}}
          fi
      # Copied verbatim. The artifact under locks/ is a real uv.lock, not a
      # template, and uv.lock.jinja includes it through jinja -- so a stray
      # delimiter in it would either fail the render or silently eat content.
      # Assert there is none rather than trusting that a lock never grows one.
      # (Built as a shell variable to keep a literal `{{` out of this taskfile,
      # which go-task would try to expand itself.)
      - |
          set -eu
          SRC="{{.LOCK_DIR}}/uv.lock"
          DEST="template/{{`{{agent_app_name}}`}}/locks/{{.AGENT}}/uv.lock"
          BRACE='{'
          if grep -q "$BRACE$BRACE" "$SRC" || grep -q "$BRACE%" "$SRC"; then
            echo "ERROR: $SRC contains a jinja delimiter; locks/ artifacts must be literal TOML." >&2
            exit 1
          fi
          if ! grep -q '^name = "af-agent-placeholder"$' "$SRC"; then
            echo "ERROR: $SRC has no af-agent-placeholder root package name." >&2
            echo "       uv.lock.jinja has nothing to substitute; check LOCK_APP_NAME." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$DEST")"
          cp "$SRC" "$DEST"
          echo "Wrote $DEST"

  update-lock-file-all:
    desc: "Regenerate every pre-baked uv.lock"
    # One entry per distinct resolution, not per framework. `nat` resolves
    # identically to `base`, and the memory providers add no dependencies, so both
    # share base's lock -- see the header of uv.lock.jinja. Do not add an entry
    # back without first confirming the graph actually differs; the copies this
    # replaced had drifted apart on their own.
    cmds:
      - task: update-lock-file
        vars:
          AGENT: "base"
      - task: update-lock-file
        vars:
          AGENT: "crewai"
      - task: update-lock-file
        vars:
          AGENT: "langgraph"
      - task: update-lock-file
        vars:
          AGENT: "llamaindex"

  run-cli:
    desc: "Run CLI"
    cmds:
      - task: render-install
        vars:
          AGENT: "base"
      - echo "Running tests for {{.AGENT}}"
      - cd $RENDER_DIR/agent_base && echo "DATAROBOT_API_TOKEN=secret" > .env && echo "DATAROBOT_ENDPOINT=https://test.com/api/v2" >> .env
      - task agent:cli --dir $RENDER_DIR/agent_base -- execute --user_prompt "Artificial Intelligence" > $RENDER_DIR/agent_base/agent/output.log 2>&1

  test-cli:
    desc: "Test CLI"
    cmds:
      - task: run-cli
      - task: check-output

  check-output:
      # These checks always run against the base agent, whose LLM call is a mock
      # and emits no NAT intermediate LLM-token steps, so DRAgent's console
      # frontend takes the non-streaming path and prints "Workflow Result:".
      # (Streaming frameworks like langgraph instead print "Run finished." with no
      # result line - see .github/workflows/afcomponentagent-smoke-test.yaml.)
      - if [ $(wc -l < $RENDER_DIR/agent_base/agent/output.log) -lt 13 ]; then exit 1; fi
      - if ! cat $RENDER_DIR/agent_base/agent/output.log | grep -q "Running CLI execute"; then exit 1; fi
      - if ! cat $RENDER_DIR/agent_base/agent/output.log | grep -q "Running agent with user prompt"; then exit 1; fi
      - 'if ! cat $RENDER_DIR/agent_base/agent/output.log | grep -q "Workflow Result:"; then exit 1; fi'

  run-cli-streaming:
    desc: "Run CLI with Streaming"
    cmds:
      - task: render-install
        vars:
          AGENT: "base"
      - echo "Running tests for {{.AGENT}}"
      - cd $RENDER_DIR/agent_base && echo "DATAROBOT_API_TOKEN=secret" > .env && echo "DATAROBOT_ENDPOINT=https://test.com/api/v2" >> .env
      - task agent:cli --dir $RENDER_DIR/agent_base -- execute --user_prompt "Artificial Intelligence" > $RENDER_DIR/agent_base/agent/output.log 2>&1

  test-cli-streaming:
    desc: "Test CLI with Streaming"
    cmds:
      - task: run-cli-streaming
      - task: check-output

  build-docker:
    desc: "Build docker image"
    cmds:
      - task: render-install
        vars:
          AGENT: "{{.AGENT}}"
      - echo "Building docker image for {{.AGENT}}"
      - task agent:build-docker --dir $RENDER_DIR/agent_{{.AGENT}}

  build-docker-base:
    desc: "Build docker for base agent"
    cmds:
      - task: build-docker
        vars:
          AGENT: base

  build-docker-crewai:
    desc: "Build docker for crewai agent"
    cmds:
      - task: build-docker
        vars:
          AGENT: crewai

  build-docker-langgraph:
    desc: "Build docker for langgraph agent"
    cmds:
      - task: build-docker
        vars:
          AGENT: langgraph

  build-docker-llamaindex:
    desc: "Build docker for llamaindex agent"
    cmds:
      - task: build-docker
        vars:
          AGENT: llamaindex

  build-docker-nat:
    desc: "Build docker image for NAT"
    cmds:
      - task: build-docker
        vars:
          AGENT: nat

  e2e:
    desc: "Run full deployment E2E for all agents (requires DATAROBOT_ENDPOINT + DATAROBOT_API_TOKEN)"
    cmds:
      - echo "Running full deployment E2E (all agent frameworks)"
      - |
          # Load local repo `.env` (gitignored) if present.
          # Keep it scoped to E2E so credentials don't leak into unrelated tasks.
          set -a
          if [ -f ".env" ]; then
            . ".env"
          fi
          set +a

          if [ -n "${VIRTUAL_ENV:-}" ]; then
            RUN_E2E=1 uv run --all-extras --active pytest --import-mode=importlib -vv -s ./tests/e2e/test_agent_e2e.py
          else
            RUN_E2E=1 uv run --all-extras pytest --import-mode=importlib -vv -s ./tests/e2e/test_agent_e2e.py
          fi

  e2e-workload:
    desc: "Run Workload API E2E (set RUN_AGENT_WORKLOAD_DEPLOY_TESTS=0 for plan-only)"
    cmds:
      - echo "Running Workload API E2E"
      - |
          # Load local repo `.env` (gitignored) if present.
          # Keep it scoped to E2E so credentials don't leak into unrelated tasks.
          set -a
          if [ -f ".env" ]; then
            . ".env"
          fi
          set +a

          if [ -n "${VIRTUAL_ENV:-}" ]; then
            RUN_E2E=1 uv run --all-extras --active pytest --import-mode=importlib -vv -s ./tests/e2e/test_agent_workload_e2e.py
          else
            RUN_E2E=1 uv run --all-extras pytest --import-mode=importlib -vv -s ./tests/e2e/test_agent_workload_e2e.py
          fi
