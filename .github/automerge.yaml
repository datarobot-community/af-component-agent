# ─────────────────────────────────────────────────────────────────────────────
# Automerge policy.
#
# The presence of this file is what enrols the repo. Delete it and automerge
# stops, with no workflow edit needed.
#
# It is always read from the DEFAULT BRANCH, never from a PR head, so a pull
# request cannot ship a policy that grants itself permission to be merged.
#
# See docs/AUTOMERGE.md in datarobot-oss/github-actions for the full picture,
# and note the one rule that matters: the ruleset is the enforcer, this file is
# an EXTRA gate on top of it. `main` carries required_status_checks with an
# empty bypass list, so nothing here can cause a failing PR to merge.
# ─────────────────────────────────────────────────────────────────────────────

version: 1

# Only Dependabot for now. cve-sync opens its PRs as the `cve-sync` App, but
# the COMMITS on those PRs are authored by `github-actions[bot]`, and
# allow-listing that would trust every workflow in the repo. Adding cve-sync
# needs that solved separately; do not just append it here.
allowed_authors:
  - dependabot[bot]

label: automerge

# ─────────────────────────────────────────────────────────────────────────────
# Each of these must be PRESENT and green. Not "not failing": present. A PR
# where a suite never ran at all is refused.
#
# THIS LIST IS WHERE THE REAL COVERAGE LIVES ON THIS REPO. The ruleset on
# `main` requires exactly one context, `gate / cve-sync gate`. Everything else
# below is unrequired, so native auto-merge or a rules-API-only bot would merge
# a Dependabot bump having verified almost nothing.
#
# Listing them here is safe in a way that requiring them is not: a required
# context a PR never fires wedges that PR forever, whereas a missing expected
# check just means the PR waits for a human instead of self-merging.
#
# The first seven are the always-reporting gate jobs added 2026-09-11. Each is
# either an unconditional single-job workflow or a job with `if: always()`
# behind a `changes` filter, so every one of them reports on every PR, green
# via skip when the matrix underneath it was not relevant.
#
# DELIBERATELY ABSENT, verified by reading each workflow's triggers:
# - release/`version`  — workflow-create-release-on-merge.yaml is push-to-main
#                        only, so it never reports on a PR.
# - `backport`         — workflow-backport.yaml runs on closed/labeled PRs.
# - PR-automation jobs — workflow-pr-automation.yaml's helpers are written not
#                        to red-X a PR, and they fire on label/review events
#                        that a bot PR may never raise. `block_on_any_failure`
#                        below still catches them if one does go red.
#
# If a name here is wrong the PR refuses to merge and escalates rather than
# merging unverified, so the failure direction is safe. Watch the first live
# verdict anyway: `Docker Build CI` is a rename, and PR #684 was still
# reporting the old `Test Docker Build`.
# ─────────────────────────────────────────────────────────────────────────────
expected_checks:
  - "Test CLI"
  - "Check for Windows-incompatible file paths"
  - "Infra CI"
  - "Frameworks CI"
  - "Docker Build CI"
  - "Smoke CI"
  - "E2E CI"
  # Already required by the `main` ruleset and added automatically from the
  # branch rules API. Repeated anyway: if someone edits the ruleset and drops
  # it, this file still holds the line.
  - "gate / cve-sync gate"

# Refuse when ANY check is failing, including ones neither required nor listed.
# `skipped` and `neutral` count as a pass.
block_on_any_failure: true

settle_seconds: 300

# A grouped github-actions bump touches one file per workflow that pins an
# action. That is 13 workflows plus `.github/actions/setup-caching/action.yml`,
# so 14 is the realistic ceiling today and 20 leaves room for a few more
# workflows. Anything much larger is not the PR we think it is.
max_changed_files: 20

# Dependabot here is scoped to the github-actions ecosystem across `/` and
# `/.github/actions/*`, so a PR touching anything outside those is by
# definition not the PR this policy is for. `.github/actions/**` matters: the
# composite actions pin their own dependencies (setup-caching pins
# `actions/cache`) and Dependabot bumps them in the same grouped PR.
allowed_paths:
  - ".github/workflows/**"
  - ".github/actions/**"
  - ".github/dependabot.yml"

# `main review` allows squash only; any other method is refused by GitHub.
merge_method: squash

# ─────────────────────────────────────────────────────────────────────────────
# What happens when automerge gives up.
#
# Transient refusals (checks still running, settling, branch behind base) just
# wait for the next poll. Terminal ones do not: a red check never goes green on
# its own, and a PR touching files outside `allowed_paths` never will.
#
# On a terminal refusal the bot drops the `automerge` label, applies the label
# below, and posts a new comment explaining why. Dropping `automerge` is what
# makes that happen exactly once: the PR stops being a candidate.
#
# `00 - Ready for Review` puts the PR into the normal review queue. Because the
# label is applied with the App token rather than GITHUB_TOKEN, it also
# triggers workflow-pr-automation.yaml's Slack ping, so somebody actually hears
# about it.
# ─────────────────────────────────────────────────────────────────────────────
escalate_label: "00 - Ready for Review"
