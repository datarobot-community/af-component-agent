---
name: af-component-agent CLI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Exact version, so arduino/setup-task skips its anonymous tag lookup on
  # api.github.com (rate-limited per shared runner IP). Keep in step across repos.
  TASK_VERSION: "3.50.0"

jobs:
  test-cli:
    name: "Test CLI"
    runs-on: "ubuntu-latest"
    container:
      # trixie, not bookworm: the `-bookworm` python variants are frozen at uv
      # 0.9.30; the `-trixie` variants track current uv.
      image: ghcr.io/astral-sh/uv:python3.11-trixie
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup caching
        uses: ./.github/actions/setup-caching
        id: setup-cache
        with:
          python-version: python3.11
          cache-key-suffix: cli
      - name: Render copier instance
        if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/render-copier-instance
        with:
          copier-args: '--defaults'
      - name: Setup infra files and install dependencies
        shell: sh
        working-directory: ./rendered
        run: |
          task install
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Run CLI Tests
        shell: sh
        working-directory:
        run: ./tests/test-cli.sh rendered
        env:
          UV_CACHE_DIR: /.uv_cache
          BASE_RENDER_DIR: ./rendered
          LLM_DEFAULT_MODEL: "datarobot/azure/gpt-5-mini-2025-08-07"
