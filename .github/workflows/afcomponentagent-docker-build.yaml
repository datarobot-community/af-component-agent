---
name: af-component-agent Docker Build
# `.github/**` is in the path filters below on purpose, and it is deliberately
# the whole folder rather than this file alone.
#
# This is the one suite wired to run on ANY `.github` change, which in practice
# means every Dependabot github-actions bump. It is the suite most worth firing
# on one: it builds the agent image end to end, so it is where a bumped action
# is most likely to actually break something, and it needs no secrets, so a
# Dependabot event can run it. Dependabot touches an arbitrary subset of
# `.github/workflows/**` and `.github/actions/**`, so matching the folder is
# what makes that automatic rather than a list to keep in sync.
#
# The other suites keep their narrow paths. They fire on a bump only if
# Dependabot happens to touch their own workflow file, which is why
# `.github/automerge.yaml` does not list them as expected checks. The smoke and
# E2E suites go further and skip the `dependabot[bot]` actor outright, because
# a Dependabot event cannot read the credentials they need.
on:
  push:
    branches: ["main"]
    paths:
      - "template/**/locks/**"
      - "template/**/pyproject.toml.jinja"
      - ".github/**"
  pull_request:
    branches: ["main"]
    paths:
      - "template/**/locks/**"
      - "template/**/pyproject.toml.jinja"
      - ".github/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  docker-build:
    name: "Test Docker Build"
    # Runs directly on the host (no `container:`). Building the agent image needs
    # the Docker daemon, which the uv container image does not provide; the host
    # runner ships Docker, and uv is installed below.
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Render copier instance
        uses: ./.github/actions/render-copier-instance
        with:
          copier-args: '--defaults'
      - name: Fix rendered file ownership
        # On the host the render action falls back to `docker run`, so ./rendered
        # is created as root. Hand it back to the runner user so the uv sync and
        # docker build steps below can write into it.
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" ./rendered
      - name: Build Docker image
        # Verifies build-docker-context runs end-to-end: create context -> uv sync
        # -> docker build. We only care that the image builds, so SKIP_DOCKER_SAVE
        # skips exporting it to a tarball.
        shell: bash
        working-directory: ./rendered
        run: uvx --from go-task-bin task agent:build-docker-context
        env:
          SKIP_DOCKER_SAVE: "true"
