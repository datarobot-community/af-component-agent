---
name: af-component-agent Docker Build
on:
  push:
    branches: ["main"]
    paths:
      - "template/**/locks/**"
      - "template/**/pyproject.toml.jinja"
      - ".github/workflows/afcomponentagent-docker-build.yaml"
  # No `paths:` filter on pull_request, on purpose. A workflow that a path
  # filter skips reports no check at all, so it can never serve as a required
  # status check: the PR sits pending on it forever. The filtering moved into
  # the `changes` job below, which lets the gate job report on every PR.
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    name: "Resolve changed paths"
    permissions:
      contents: read
      # dorny/paths-filter reads the PR's changed files through the API.
      pull-requests: read
    runs-on: "ubuntu-latest"
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'template/**/locks/**'
              - 'template/**/pyproject.toml.jinja'
              - '.github/workflows/afcomponentagent-docker-build.yaml'
      - name: Decide whether to run
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELEVANT: ${{ steps.filter.outputs.relevant }}
        run: |
          set -euo pipefail
          # Dependabot always runs the full suite. Its PRs only ever touch
          # `.github/**`, so the product filters above would skip almost
          # everything. But the actions it bumps ARE the machinery these jobs
          # run on. Auto-merge waits only on required checks, so a check that
          # skips itself is a check that merges the bump untested.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # push / workflow_dispatch: the `on: paths` filter already decided.
            RUN=true
          elif [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            RUN=true
          else
            RUN="${RELEVANT:-false}"
          fi
          echo "Run tests: $RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  docker-build:
    name: "Test Docker Build"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Runs directly on the host (no `container:`). Building the agent image needs
    # the Docker daemon, which the uv container image does not provide; the host
    # runner ships Docker, and uv is installed below.
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Render copier instance
        uses: ./.github/actions/render-copier-instance
        with:
          copier-args: '--defaults'
      - name: Fix rendered file ownership
        # On the host the render action falls back to `docker run`, so ./rendered
        # is created as root. Hand it back to the runner user so the uv sync and
        # docker build steps below can write into it.
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" ./rendered
      - name: Build Docker image
        # Verifies build-docker-context runs end-to-end: create context -> uv sync
        # -> docker build. We only care that the image builds, so SKIP_DOCKER_SAVE
        # skips exporting it to a tarball.
        shell: bash
        working-directory: ./rendered
        run: uvx --from go-task-bin task agent:build-docker-context
        env:
          SKIP_DOCKER_SAVE: "true"

  docker-gate:
    name: "Docker Build CI"
    # The stable, always-reporting context to mark required on `main`. Matrix
    # job names are unusable for that (they multiply, and they change whenever
    # the matrix does), and a skipped job reports nothing to require. This one
    # always runs: it passes when the work above passed or was legitimately
    # skipped, and fails when any of it failed or was cancelled.
    needs: [changes, docker-build]
    if: always()
    runs-on: "ubuntu-latest"
    steps:
      - name: Check upstream results
        shell: bash
        env:
          RESULTS: "${{ needs.changes.result }} ${{ needs.docker-build.result }}"
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "An upstream job finished with: $result"; exit 1 ;;
            esac
          done
          echo "All upstream jobs passed or were skipped."
