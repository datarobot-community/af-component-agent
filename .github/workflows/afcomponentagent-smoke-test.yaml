---
name: af-component-agent Smoke Tests
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "template/*/agent/**"
      - ".github/workflows/afcomponentagent-smoke-test.yaml"
  # No `paths:` filter on pull_request, on purpose. A workflow that a path
  # filter skips reports no check at all, so it can never serve as a required
  # status check: the PR sits pending on it forever. The filtering moved into
  # the `changes` job below, which lets the gate job report on every PR.
  pull_request:
    branches: ["main"]

jobs:
  changes:
    name: "Resolve changed paths"
    permissions:
      contents: read
      # dorny/paths-filter reads the PR's changed files through the API.
      pull-requests: read
    runs-on: "ubuntu-latest"
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'template/*/agent/**'
              - '.github/workflows/afcomponentagent-smoke-test.yaml'
      - name: Decide whether to run
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEVANT: ${{ steps.filter.outputs.relevant }}
        run: |
          set -euo pipefail
          # DELIBERATELY no Dependabot override here, unlike the other test
          # workflows. A `pull_request` event raised by Dependabot runs with
          # Dependabot secrets, NOT the repository's Actions secrets, and this
          # repo has zero of those (`/dependabot/secrets` returns 0). The smoke
          # matrix needs DATAROBOT_API_TOKEN and DATAROBOT_ENDPOINT from the
          # `integration` environment, so forcing it on for Dependabot would
          # fail 100% of the time on empty credentials rather than test
          # anything. `Smoke CI` stays safe to mark required regardless: the
          # gate job reports success when the matrix is skipped.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # push / workflow_dispatch: the `on: paths` filter already decided.
            RUN=true
          else
            RUN="${RELEVANT:-false}"
          fi
          echo "Run tests: $RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: "Smoke / ${{ matrix.framework }} / ${{ matrix.model.label }}"
    needs: changes
    # Two independent gates. `changes` decides whether the smoke suite is
    # relevant at all; the fork check keeps the integration secrets out of
    # reach of attacker-controlled code. Same-repo branches, pushes to main,
    # and workflow_dispatch still run normally.
    if: >-
      needs.changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.fork == false)
    runs-on: "ubuntu-latest"
    environment: integration
    container:
      # trixie, not bookworm: the `-bookworm` python variants are frozen at uv
      # 0.9.30; the `-trixie` variants track current uv.
      image: ghcr.io/astral-sh/uv:python3.11-trixie
    strategy:
      fail-fast: false
      matrix:
        framework: [crewai, langgraph, llamaindex]
        model:
          - label: gpt
            id: "datarobot/azure/gpt-5-1-2025-11-13"
          - label: sonnet
            id: "datarobot/anthropic/claude-sonnet-4-5-20250929"
          - label: gemini
            id: "datarobot/vertex_ai/gemini-3.1-pro-preview"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Setup caching
        uses: ./.github/actions/setup-caching
        with:
          python-version: python3.11
          cache-key-suffix: smoke-${{ matrix.framework }}-${{ matrix.model.label }}
      - name: Render template
        uses: ./.github/actions/render-copier-instance
        with:
          copier-args: "--defaults --data agent_template_framework=${{ matrix.framework }}"
      - name: Install agent dependencies
        shell: sh
        working-directory: ./rendered
        run: uvx --from go-task-bin task agent:install
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Write credentials
        shell: sh
        working-directory: ./rendered
        run: |
          printf 'DATAROBOT_API_TOKEN=%s\n' "$DATAROBOT_API_TOKEN" > .env
          printf 'DATAROBOT_ENDPOINT=%s\n' "$DATAROBOT_ENDPOINT" >> .env
          if [ "$FRAMEWORK" = "crewai" ]; then
            echo "CREWAI_TESTING=true" >> .env
          fi
        env:
          DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
          DATAROBOT_ENDPOINT: ${{ secrets.DATAROBOT_ENDPOINT }}
          FRAMEWORK: ${{ matrix.framework }}
      - name: Run smoke test
        shell: sh
        working-directory: ./rendered
        run: |
          uvx --from go-task-bin task agent:cli -- \
            execute \
            --user_prompt "Reply with one word: OK." \
            > ./agent/output.log 2>&1
          cat ./agent/output.log
        env:
          UV_CACHE_DIR: /.uv_cache
          LLM_DEFAULT_MODEL: ${{ matrix.model.id }}
      - name: Validate response
        shell: sh
        working-directory: ./rendered
        run: |
          if grep -qi "^error:" ./agent/output.log || grep -q "failed to obtain agent chat response" ./agent/output.log; then
            echo "FAIL: agent returned an error response"
            exit 1
          fi
          # DRAgent's console frontend prints one of two completion markers:
          # "Workflow Result:" for non-streaming frameworks, or "Run finished."
          # for frameworks that stream token deltas (e.g. langgraph). Both are
          # emitted only after the workflow completes successfully.
          if ! grep -qE "Workflow Result:|Run finished\." ./agent/output.log; then
            echo "FAIL: no execution result found in output"
            exit 1
          fi
          echo "PASS: smoke test succeeded"
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.framework }}-${{ matrix.model.label }}
          path: ./rendered/agent/output.log

  smoke-gate:
    name: "Smoke CI"
    # The stable, always-reporting context to mark required on `main`. Matrix
    # job names are unusable for that (they multiply, and they change whenever
    # the matrix does), and a skipped job reports nothing to require. This one
    # always runs: it passes when the work above passed or was legitimately
    # skipped, and fails when any of it failed or was cancelled.
    needs: [changes, smoke-test]
    if: always()
    runs-on: "ubuntu-latest"
    steps:
      - name: Check upstream results
        shell: bash
        env:
          RESULTS: "${{ needs.changes.result }} ${{ needs.smoke-test.result }}"
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "An upstream job finished with: $result"; exit 1 ;;
            esac
          done
          echo "All upstream jobs passed or were skipped."
