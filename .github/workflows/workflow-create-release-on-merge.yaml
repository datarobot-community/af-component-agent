name: Create Release on Merge to Main

# ─────────────────────────────────────────────────────────────────────────────
# Create Release on Merge to Main
# On a push to main, tags the next patch version and cuts a GitHub release, but
# only if a rendered file changed since the latest tag. Each tag triggers a
# Diffington sync PR (and E2E run) in every consumer, so tooling-only merges
# skip the release.
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED LABELS
# - None.
# ─────────────────────────────────────────────────────────────────────────────

# Triggered by: every push to main (i.e. a merged PR). No `paths:` filter, so a
# failed release is retried by the next merge.
on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tag the next patch version and cut a GitHub release, if the gate opens.
  release:
    uses: datarobot-oss/github-actions/.github/workflows/create-release-on-merge.yaml@0.0.32
    permissions:
      contents: write
      pull-requests: read
    with:
      # Only these are rendered (copier.yml sets `_subdirectory: template`).
      release_gate_paths: |
        copier.yml
        template/**
