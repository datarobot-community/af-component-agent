---
# Turns on GitHub's native auto-merge for Dependabot pull requests.
#
# This does NOT bypass branch protection. Auto-merge only queues the PR; GitHub
# squash-merges it once every protection rule on `main` is satisfied, which
# still includes one approving review from a @datarobot-community/buzok code
# owner. You approve once and walk away; you do not come back to click merge.
#
# Auto-merge waits ONLY on checks marked required in branch protection.
# Everything else is decorative: a non-required job can fail and the PR merges
# anyway. So the test workflows now each end in an always-reporting gate job,
# and those gate names are what belong in the required list on `main`:
#
#   Test CLI, Check for Windows-incompatible file paths,
#   Infra CI, Docker Build CI, Frameworks CI, E2E CI, Smoke CI
#
# Those workflows no longer carry a `paths:` filter on pull_request, because a
# path-filtered workflow reports no check at all and would leave a required
# context pending forever. They decide internally instead, and a Dependabot
# author forces the full suite on: the actions it bumps are the machinery every
# one of those jobs runs on.
#
# Scoped to the github-actions ecosystem on purpose. Real dependencies are
# managed by cve-sync, not Dependabot, and this guard means that if a `pip`
# entry is ever added back to dependabot.yml it will not silently auto-merge.
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: "Enable auto-merge"
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge
        if: steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
