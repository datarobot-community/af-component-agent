---
name: af-component-agent Frameworks
on:
  push:
    branches: ["main"]
    paths:
      - "fixtures/**"
      - "template/**"
      - ".github/actions/copier-template-validator/**"
      - ".github/workflows/afcomponentagent-framework-test.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "fixtures/**"
      - "template/**"
      - ".github/actions/copier-template-validator/**"
      - ".github/workflows/afcomponentagent-framework-test.yaml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-frameworks:
    name: "Test ${{ matrix.framework.agent_name }} (${{ matrix.python }})"
    runs-on: "ubuntu-latest"
    container:
      # trixie, not bookworm: astral stopped rebuilding the `-bookworm` python
      # variants at uv 0.9.30, so that floating tag is frozen and too old for
      # the template's `required-version`. The `-trixie` variants track current.
      image: ghcr.io/astral-sh/uv:${{ matrix.python }}-trixie
    strategy:
      fail-fast: false
      matrix:
        python: [python3.11, python3.12, python3.13]
        framework:
          - name: base
            agent_name: agent_generic_base
            with_memory: false
          # Provider coverage lives in af-component-memory. This leg only proves
          # the agent renders and behaves when a memory component is present.
          - name: base
            agent_name: agent_with_memory
            with_memory: true
          - name: crewai
            agent_name: agent_crewai
            with_memory: false
          - name: langgraph
            agent_name: agent_langgraph
            with_memory: false
          - name: llamaindex
            agent_name: agent_llamaindex
            with_memory: false
          - name: nat
            agent_name: agent_nat
            with_memory: false
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      # The agent imports the memory component's infra module by the name in its
      # answers file, so that file has to exist in the render destination before
      # copier runs -- the same ordering the local `render-template` task uses.
      # af-component-memory is not in copier-module.yaml (it is optional, and
      # only this one leg needs it), so the validator action will not produce the
      # file for us. The action creates the destination but never wipes it.
      - name: Place memory component answers
        if: matrix.framework.with_memory
        shell: sh
        run: |
          mkdir -p ./rendered/.datarobot/answers
          cp ./fixtures/.datarobot/answers/memory-memory.yml ./rendered/.datarobot/answers/memory-memory.yml
      - name: Render template
        uses: ./.github/actions/copier-template-validator
        with:
          working-directory: .
          rendered-dir: ./rendered
          copier-args: '--data agent_app_name=${{ matrix.framework.agent_name }} --data agent_template_framework=${{ matrix.framework.name }} --data base_answers_file=.datarobot/answers/base.yml'
      - name: Check lock file
        shell: sh
        working-directory: ./rendered/${{ matrix.framework.agent_name }}
        run: |
          echo "Checking lock file. If it fails, see to docs/development.md for instructions on how to update the lock file."
          echo "And if it still fails for some reason, do uv lock here to see what is causing the issue."
          uv lock --check
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Install dependencies
        shell: sh
        working-directory: ./rendered/${{ matrix.framework.agent_name }}
        run: |
          uvx --from go-task-bin task install
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: License Header Check
        if: matrix.python == 'python3.11'
        uses: apache/skywalking-eyes/header@main
        with:
          config: .github/.licenserc.yaml
      - name: Run linter
        shell: sh
        working-directory: ./rendered/${{ matrix.framework.agent_name }}
        run: |
          uvx --from go-task-bin task lint-check
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Run unit tests
        shell: sh
        working-directory: ./rendered/${{ matrix.framework.agent_name }}
        run: |
          uvx --from go-task-bin task test-coverage
        env:
          UV_CACHE_DIR: /.uv_cache
          LLM_DEFAULT_MODEL: "datarobot/azure/gpt-5-mini-2025-08-07"
      - name: Install agentic playground dependencies
        shell: sh
        working-directory: ./rendered/${{ matrix.framework.agent_name }}
        run: |
          uv sync --extra agentic_playground --extra dev
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Run unit tests with agentic playground dependencies
        shell: sh
        working-directory: ./rendered/${{ matrix.framework.agent_name }}
        run: |
          uvx --from go-task-bin task test-coverage
        env:
          UV_CACHE_DIR: /.uv_cache
          LLM_DEFAULT_MODEL: "datarobot/azure/gpt-5-mini-2025-08-07"
