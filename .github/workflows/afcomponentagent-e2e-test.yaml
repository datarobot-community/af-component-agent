---
name: af-component-agent E2E
on:
  push:
    branches: ["main"]
    paths:
      - "template/**"
      - "!template/docs/**"
      - "!template/.agents/skills/**"
      - "fixtures/**"
      - "tests/e2e/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/afcomponentagent-e2e-test.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "template/**"
      - "!template/docs/**"
      - "!template/.agents/skills/**"
      - "fixtures/**"
      - "tests/e2e/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/afcomponentagent-e2e-test.yaml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a running job: it may be mid-deploy, and killing it risks
  # leaving a live DataRobot deployment behind before teardown can run. A
  # superseded run on the same ref queues behind the current one instead.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  setup:
    name: "Resolve framework matrix"
    runs-on: "ubuntu-latest"
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: "actions/checkout@v6"
      - name: Detect changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base:
              - 'template/**/*_base.*'
              - 'template/**/uvlock_base*.j2'
            crewai:
              - 'template/**/*_crewai.*'
              - 'template/**/uvlock_crewai*.j2'
            langgraph:
              - 'template/**/*_langgraph.*'
              - 'template/**/uvlock_langgraph*.j2'
            llamaindex:
              - 'template/**/*_llamaindex.*'
              - 'template/**/uvlock_llamaindex*.j2'
            nat:
              - 'template/**/*_nat.*'
              - 'template/**/uvlock_nat*.j2'
            core:
              - 'template/**/*.jinja'
              # Shared multi-framework partials (e.g. custom_default.py.j2 renders
              # into every framework but nat) — a change affects all, so treat as
              # core → run all 5 rather than narrowing to a co-changed framework.
              - 'template/**/*_default.*'
              - 'fixtures/**'
              - 'tests/e2e/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/afcomponentagent-e2e-test.yaml'
      - name: Resolve matrix
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CORE: ${{ steps.filter.outputs.core }}
          CHANGED_base: ${{ steps.filter.outputs.base }}
          CHANGED_crewai: ${{ steps.filter.outputs.crewai }}
          CHANGED_langgraph: ${{ steps.filter.outputs.langgraph }}
          CHANGED_llamaindex: ${{ steps.filter.outputs.llamaindex }}
          CHANGED_nat: ${{ steps.filter.outputs.nat }}
        run: |
          set -euo pipefail
          ALL='["base","crewai","langgraph","llamaindex","nat"]'
          if [ "$EVENT_NAME" = "pull_request" ] && [ "${CORE:-}" != "true" ]; then
            # PR touching no shared/core path: run only frameworks whose files
            # changed. Iterate ALL so order is preserved; fail safe to ALL if
            # nothing mapped (never emit an empty matrix).
            MATRIX=$(jq -cn --argjson all "$ALL" \
              --arg base "${CHANGED_base:-}" --arg crewai "${CHANGED_crewai:-}" \
              --arg langgraph "${CHANGED_langgraph:-}" --arg llamaindex "${CHANGED_llamaindex:-}" \
              --arg nat "${CHANGED_nat:-}" \
              '{base:$base,crewai:$crewai,langgraph:$langgraph,llamaindex:$llamaindex,nat:$nat} as $f
               | [ $all[] | select($f[.] == "true") ]')
            if [ "$MATRIX" = "[]" ]; then
              MATRIX="$ALL"
            fi
          else
            # push-to-main (or a PR touching a shared/core path) → all five.
            MATRIX="$ALL"
          fi
          echo "Resolved matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
  e2e-custom-models:
    name: "E2E / ${{ matrix.framework }}"
    needs: setup
    # Skip on fork PRs so integration secrets are never reachable from
    # attacker-controlled code. Same-repo branches and pushes to main
    # still run normally.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: "ubuntu-latest"
    environment: integration
    # Single source of truth for the stack name so the Run E2E step and the
    # teardown net can never drift apart and orphan a stack.
    env:
      E2E_PULUMI_STACK: af-component-agent-e2e-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      # trixie, not bookworm: the `-bookworm` python variants are frozen at uv
      # 0.9.30; the `-trixie` variants track current uv.
      image: ghcr.io/astral-sh/uv:python3.11-trixie
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Setup caching
        uses: ./.github/actions/setup-caching
        with:
          python-version: python3.11
          cache-key-suffix: e2e-${{ matrix.framework }}
      # The uv base image ships uv + Python but not the Pulumi CLI (a native
      # binary, not a uv/pip package). The self-rendering E2E drives Pulumi via
      # `uv run pulumi`, which only resolves when the binary is on PATH. Pinned
      # to a specific release and SHA-256-verified (stronger than the sibling
      # infra-test's `curl … | sh`, since this job holds live DataRobot creds).
      - name: Install pulumi
        shell: bash
        env:
          PULUMI_VERSION: "3.249.0"
          PULUMI_SHA256: "0c4acfac957f578e406a3ae9f7042c57f05c4ad9e4b1c83ba0fcf3395e2a0b74"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          tarball="pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz"
          curl -fsSL -o "${workdir}/${tarball}" \
            "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/${tarball}"
          echo "${PULUMI_SHA256}  ${workdir}/${tarball}" | sha256sum -c -
          tar -xzf "${workdir}/${tarball}" -C "${workdir}"
          echo "${workdir}/pulumi" >> "$GITHUB_PATH"
      - name: Run E2E
        shell: bash
        env:
          UV_CACHE_DIR: /.uv_cache
          RUN_E2E: "1"
          E2E_AGENT_FRAMEWORKS: ${{ matrix.framework }}
          # Deploy + tracing check only on push to main (merges); PRs run build + codespace.
          RUN_AGENT_DEPLOYMENT_TESTS: ${{ github.event_name == 'push' && '1' || '0' }}
          LLM_DEFAULT_MODEL: "datarobot/azure/gpt-5-mini-2025-08-07"
          DATAROBOT_ENDPOINT: ${{ secrets.DATAROBOT_ENDPOINT }}
          DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
        run: |
          # Capture console output (nothing else writes log files) so the
          # failure artifact carries real triage data. `shell: bash` runs with
          # -o pipefail, so a pytest failure still fails the step despite tee.
          uv run --all-extras pytest --import-mode=importlib -vv -s \
            ./tests/e2e/test_agent_e2e.py 2>&1 | tee "e2e-${{ matrix.framework }}.log"
      - name: Tear down E2E resources
        if: always()
        shell: bash
        env:
          DATAROBOT_ENDPOINT: ${{ secrets.DATAROBOT_ENDPOINT }}
          DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
        run: |
          # Always destroy this run's DataRobot resources — on success, failure,
          # or cancellation. The test's own `finally` also tears down on a normal
          # exit; this net additionally covers the cancelled/killed case, and the
          # Harness `cleanup_leftovers` pipeline is the final backstop.
          stack="${E2E_PULUMI_STACK}"
          rendered="./.rendered/agent_${{ matrix.framework }}"
          infra="${rendered}/infra"
          if [ ! -d "$infra" ]; then
            echo "No rendered infra dir for ${stack}; nothing to clean."
            exit 0
          fi
          export PULUMI_CONFIG_PASSPHRASE=123
          export PULUMI_HOME="${rendered}/.pulumi_home"
          mkdir -p "$PULUMI_HOME"
          # Re-materialize creds in case the test's finally already removed .env.
          {
            echo "DATAROBOT_ENDPOINT=${DATAROBOT_ENDPOINT}"
            echo "DATAROBOT_API_TOKEN=${DATAROBOT_API_TOKEN}"
            echo "PULUMI_STACK=${stack}"
            echo "PULUMI_CONFIG_PASSPHRASE=123"
            echo "PULUMI_HOME=${PULUMI_HOME}"
          } > "${rendered}/.env"
          # Trace teardown commands only — kept below the cred-file write so the
          # token and (unmasked) endpoint are never echoed into the step log.
          set -x
          # Point Pulumi at the same local (file) backend the test used. Without
          # this, `pulumi` defaults to Pulumi Cloud and fails with
          # "PULUMI_ACCESS_TOKEN must be set", making this net a silent no-op on
          # cancellation — exactly the case it exists to cover. `task destroy`
          # inherits the login via PULUMI_HOME.
          (cd "$infra" && uv run pulumi login --local) || true
          (cd "$infra" && uv run pulumi cancel --yes --stack "$stack") || true
          (cd "$rendered" && uvx --from go-task-bin task destroy -- --yes --skip-preview) || true
          (cd "$infra" && uv run pulumi stack rm -f -y "$stack") || true
      - name: Upload E2E logs
        # Also on cancellation: a runner eviction/timeout ends as `cancelled`, not
        # `failure`, and we still want the triage logs.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-${{ matrix.framework }}.log
            ./.rendered/agent_${{ matrix.framework }}/**/*.log
          # The tee'd console log is always written on failure, so a missing
          # file here signals something went wrong with capture — warn, not ignore.
          if-no-files-found: warn

  # The Workload API runtime (ENABLE_AGENT_ON_WORKLOAD_API=true). Separate job,
  # not folded into the matrix above: verification is entirely different (no
  # Playground — it POSTs to the workload's chat endpoint instead). Same matrix
  # and the same push/PR split as `e2e-custom-models` -- full coverage on every
  # push, path-narrowed on PRs.
  e2e-workload-api:
    name: "E2E / workload-api / ${{ matrix.framework }}"
    needs: setup
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: "ubuntu-latest"
    environment: integration
    env:
      E2E_PULUMI_STACK: af-component-agent-e2e-wapi-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: ghcr.io/astral-sh/uv:python3.11-trixie
    timeout-minutes: 90 # bumped from 75: the from-source provider build adds time
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Setup caching
        uses: ./.github/actions/setup-caching
        with:
          python-version: python3.11
          cache-key-suffix: e2e-workload-api-${{ matrix.framework }}
      - name: Install pulumi
        # Same pin and SHA-256 verification as the `e2e-custom-models` job
        # above; bump both together. This installs the pulumi CLI/engine —
        # separate from the resource-datarobot *plugin* built below.
        shell: bash
        env:
          PULUMI_VERSION: "3.249.0"
          PULUMI_SHA256: "0c4acfac957f578e406a3ae9f7042c57f05c4ad9e4b1c83ba0fcf3395e2a0b74"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          tarball="pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz"
          curl -fsSL -o "${workdir}/${tarball}" \
            "https://github.com/pulumi/pulumi/releases/download/v${PULUMI_VERSION}/${tarball}"
          echo "${PULUMI_SHA256}  ${workdir}/${tarball}" | sha256sum -c -
          tar -xzf "${workdir}/${tarball}" -C "${workdir}"
          echo "${workdir}/pulumi" >> "$GITHUB_PATH"

      # --- NEW: build pulumi-datarobot against the unreleased TF branch ---
      - name: Install build tooling for local pulumi-datarobot
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git make curl ca-certificates jq
          GO_VERSION="1.22.5"
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
          tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Build pulumi-datarobot from unreleased branch
        shell: bash
        env:
          # TODO: confirm clone URLs / add auth if these repos are private.
          TF_PROVIDER_REPO: "https://github.com/datarobot-community/terraform-provider-datarobot.git"
          TF_BRANCH: "brunoromano-dr/RAPTOR-19287-run-agent-app-wapi"
          PULUMI_PROVIDER_REPO: "https://github.com/datarobot-community/pulumi-datarobot.git"
          PULUMI_PROVIDER_REF: "main"
          # Deliberately higher than any real release (latest on PyPI is
          # 0.10.45 as of writing). Every real dependent only lower-bounds
          # pulumi-datarobot (>=0.10.27 direct, >=0.10.30 via
          # datarobot-pulumi-utils), so this wins uv's resolver everywhere
          # without needing to match any exact pin.
          FAKE_VERSION: "0.999.0"
        run: |
          set -euo pipefail
          export PATH="/usr/local/go/bin:${PATH}"
          BUILD_WORKSPACE="$(mktemp -d)"
          TF_PROVIDER="${BUILD_WORKSPACE}/terraform-provider-datarobot"
          PULUMI_PROVIDER="${BUILD_WORKSPACE}/pulumi-datarobot"
 
          # 1. Terraform provider branch (mirrors guide section 1)
          git clone --depth 1 --branch "${TF_BRANCH}" "${TF_PROVIDER_REPO}" "${TF_PROVIDER}"
          (cd "${TF_PROVIDER}" && go mod tidy && go build -o terraform-provider-datarobot .)
 
          # 2. Pulumi provider + Python SDK built against that TF checkout
          #    (mirrors guide section 2). Tag HEAD with the fake version so
          #    whatever version-detection the Makefile uses (git describe /
          #    pulumictl get-version) picks it up without needing to know
          #    the Makefile's internals.
          git clone --branch "${PULUMI_PROVIDER_REF}" "${PULUMI_PROVIDER_REPO}" "${PULUMI_PROVIDER}"
          git -C "${PULUMI_PROVIDER}" tag "v${FAKE_VERSION}"
 
          (cd "${PULUMI_PROVIDER}/provider" \
            && go mod edit -replace "github.com/datarobot-community/terraform-provider-datarobot=${TF_PROVIDER}" \
            && go mod tidy)
          (cd "${PULUMI_PROVIDER}" && make provider && make build_python)
          # Drop the replace so nothing machine-local leaks into any commit
          # this checkout might accidentally produce.
          (cd "${PULUMI_PROVIDER}/provider" \
            && go mod edit -dropreplace github.com/datarobot-community/terraform-provider-datarobot \
            && go mod tidy)
 
          VERSION="$(cd "${PULUMI_PROVIDER}" && make -np 2>/dev/null | awk '/^VERSION := /{print $3; exit}')"
          echo "Resolved build VERSION=${VERSION} (expected ${FAKE_VERSION})"
          if [ "${VERSION}" != "${FAKE_VERSION}" ]; then
            echo "::warning::VERSION=${VERSION} does not match FAKE_VERSION=${FAKE_VERSION} — the git-tag override wasn't honored. Find how this Makefile derives VERSION and set it directly, or the plugin/SDK version pairing below may be inconsistent."
          fi
 
          # Register the plugin under whatever VERSION was actually
          # computed, so the SDK (which embeds the same VERSION at build
          # time) finds it locally instead of downloading a mismatched
          # version from GitHub.
          rm -rf ~/.pulumi/plugins/resource-datarobot*
          pulumi plugin install resource datarobot "${VERSION}" \
            -f "${PULUMI_PROVIDER}/bin/pulumi-resource-datarobot"
          pulumi plugin ls | grep datarobot
 
          # Fail fast and cheap (seconds, right here) instead of expensive
          # and late (~40min into a real `pulumi preview`, per the
          # ArtifactSpecContainerGroupContainerArgs `routes` TypeError seen
          # in CI): confirm the fields agent code depends on actually made
          # it into this branch's generated schema before spending a full
          # E2E run finding out otherwise. Extend this list as new
          # unreleased-branch fields get consumed elsewhere in infra code.
          echo "Checking generated SDK for fields consumed by infra code..."
          for expected_field in routes; do
            if grep -rq "\b${expected_field}\b" "${PULUMI_PROVIDER}/sdk/python/bin/pulumi_datarobot/_inputs.py"; then
              echo "OK: '${expected_field}' present in generated _inputs.py"
            else
              echo "::warning::Generated SDK from ${TF_BRANCH} (pulumi-datarobot @ ${PULUMI_PROVIDER_REF}) has no '${expected_field}' field in _inputs.py — infra code expecting it will fail deep into pulumi preview/up, not here. Confirm this branch actually carries that change before re-running the full E2E."
            fi
          done
 
          # The default ~/.pulumi install above is NOT what `task preview`
          # actually uses: tests/e2e/workload_e2e.py creates a fresh,
          # isolated PULUMI_HOME under `.rendered/agent_<framework>/.pulumi_home`
          # per run (Step 3 in run_workload_agent_e2e), so the engine never
          # sees this plugin there and falls back to auto-downloading it
          # from GitHub — which 404s for a version that only exists locally.
          # Export the binary path + version so the workload_e2e.py.patch
          # hook (applied below) can copy it into that per-run PULUMI_HOME
          # once it exists.
          echo "LOCAL_DATAROBOT_PLUGIN_BINARY=${PULUMI_PROVIDER}/bin/pulumi-resource-datarobot" >> "$GITHUB_ENV"
          echo "LOCAL_DATAROBOT_PLUGIN_VERSION=${VERSION}" >> "$GITHUB_ENV"
 
          # Build an installable wheel from the local SDK (sdk/python/bin
          # only — sdk/python itself stays at 0.0.0 per the guide) and
          # expose it to every later `uv` call in this job, including the
          # one Pulumi's uv-toolchain runs internally inside
          # .rendered/agent_*/infra when it materializes that project's venv.
          LOCAL_WHEELS="$(mktemp -d)"
          uv build --wheel --out-dir "${LOCAL_WHEELS}" "${PULUMI_PROVIDER}/sdk/python/bin"
          ls "${LOCAL_WHEELS}"
          echo "UV_FIND_LINKS=${LOCAL_WHEELS}" >> "$GITHUB_ENV"
          echo "UV_INDEX_STRATEGY=unsafe-best-match" >> "$GITHUB_ENV"
      # --- END NEW ---

      - name: Run Workload API E2E
        shell: bash
        env:
          UV_CACHE_DIR: /.uv_cache
          RUN_E2E: "1"
          E2E_AGENT_FRAMEWORKS: ${{ matrix.framework }}
          RUN_AGENT_WORKLOAD_DEPLOY_TESTS: ${{ github.event_name == 'push' && '1' || '0' }}
          LLM_DEFAULT_MODEL: "datarobot/azure/gpt-5-mini-2025-08-07"
          DATAROBOT_ENDPOINT: ${{ secrets.DATAROBOT_ENDPOINT }}
          DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
        run: |
          # Unchanged from the original job — UV_FIND_LINKS/UV_INDEX_STRATEGY
          # from the previous step (propagated via GITHUB_ENV) make this
          # `uv run --all-extras`, and the `uv sync` Pulumi's toolchain runs
          # inside .rendered/agent_*/infra, both resolve pulumi-datarobot to
          # the local build automatically.
          uv run --all-extras pytest --import-mode=importlib -vv -s \
            ./tests/e2e/test_agent_workload_e2e.py 2>&1 | tee "e2e-workload-api-${{ matrix.framework }}.log"
      - name: Tear down E2E resources
        if: always()
        shell: bash
        env:
          DATAROBOT_ENDPOINT: ${{ secrets.DATAROBOT_ENDPOINT }}
          DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
        run: |
          # Unchanged from the original job — see the plugin-discovery
          # caveat at the top of this file if teardown's `pulumi cancel`/
          # `task destroy` calls fail to find the resource-datarobot plugin
          # under this run's fresh PULUMI_HOME.
          stack="${E2E_PULUMI_STACK}"
          rendered="./.rendered/agent_${{ matrix.framework }}"
          infra="${rendered}/infra"
          if [ ! -d "$infra" ]; then
            echo "No rendered infra dir for ${stack}; nothing to clean."
            exit 0
          fi
          export PULUMI_CONFIG_PASSPHRASE=123
          export PULUMI_HOME="${rendered}/.pulumi_home"
          mkdir -p "$PULUMI_HOME"
          {
            echo "DATAROBOT_ENDPOINT=${DATAROBOT_ENDPOINT}"
            echo "DATAROBOT_API_TOKEN=${DATAROBOT_API_TOKEN}"
            echo "ENABLE_AGENT_ON_WORKLOAD_API=true"
            echo "PULUMI_STACK=${stack}"
            echo "PULUMI_CONFIG_PASSPHRASE=123"
            echo "PULUMI_HOME=${PULUMI_HOME}"
          } > "${rendered}/.env"
          set -x
          (cd "$infra" && uv run pulumi login --local) || true
          (cd "$infra" && uv run pulumi cancel --yes --stack "$stack") || true
          (cd "$rendered" && uvx --from go-task-bin task destroy -- --yes --skip-preview) || true
          (cd "$infra" && uv run pulumi stack rm -f -y "$stack") || true
      - name: Upload E2E logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-workload-api-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-workload-api-${{ matrix.framework }}.log
            ./.rendered/agent_${{ matrix.framework }}/**/*.log
          if-no-files-found: warn