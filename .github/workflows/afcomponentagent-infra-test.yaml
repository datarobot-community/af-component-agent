---
name: af-component-agent Infra
on:
  push:
    branches: ["main"]
    paths:
      - "fixtures/**"
      - "template/infra/**"
      - ".github/workflows/afcomponentagent-infra-test.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "fixtures/**"
      - "template/infra/**"
      - ".github/workflows/afcomponentagent-infra-test.yaml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Exact version, so arduino/setup-task skips its anonymous tag lookup on
  # api.github.com (rate-limited per shared runner IP). Keep in step across repos.
  TASK_VERSION: "3.50.0"

jobs:
  test-infra:
    name: "Test Infra"
    runs-on: "ubuntu-latest"
    container:
      # trixie, not bookworm: the `-bookworm` python variants are frozen at uv
      # 0.9.30; the `-trixie` variants track current uv.
      image: ghcr.io/astral-sh/uv:python3.11-trixie
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup caching
        uses: ./.github/actions/setup-caching
        id: setup-cache
        with:
          python-version: python3.11
          cache-key-suffix: infra
      - name: Install pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "/github/home/.pulumi/bin" >> $GITHUB_PATH
      - name: Render copier instance
        if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/render-copier-instance
        with:
          copier-args: '--defaults'
      - name: Setup infra files and install dependencies
        shell: sh
        working-directory: ./rendered
        run: |
          task infra:install
          cd ./infra
          uv sync --extra dev
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Run linter
        shell: sh
        working-directory: ./rendered
        run: |
          task infra:lint-check
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Create pulumi stack
        working-directory: ./rendered/infra
        run: |
          pulumi login --local
          pulumi stack init -s organization/unittest/unittest
        env:
          PULUMI_CONFIG_PASSPHRASE: "123"
      - name: Run unit tests
        shell: sh
        working-directory: ./rendered
        run: |
          task infra:test-coverage
        env:
          UV_CACHE_DIR: /.uv_cache
          PULUMI_CONFIG_PASSPHRASE: "123"
