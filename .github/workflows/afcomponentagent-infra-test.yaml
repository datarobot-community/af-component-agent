---
name: af-component-agent Infra
on:
  push:
    branches: ["main"]
    paths:
      - "fixtures/**"
      - "template/infra/**"
      - ".github/workflows/afcomponentagent-infra-test.yaml"
  # No `paths:` filter on pull_request, on purpose. A workflow that a path
  # filter skips reports no check at all, so it can never serve as a required
  # status check: the PR sits pending on it forever. The filtering moved into
  # the `changes` job below, which lets the gate job report on every PR.
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: "Resolve changed paths"
    permissions:
      contents: read
      # dorny/paths-filter reads the PR's changed files through the API.
      pull-requests: read
    runs-on: "ubuntu-latest"
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'fixtures/**'
              - 'template/infra/**'
              - '.github/workflows/afcomponentagent-infra-test.yaml'
      - name: Decide whether to run
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELEVANT: ${{ steps.filter.outputs.relevant }}
        run: |
          set -euo pipefail
          # Dependabot always runs the full suite. Its PRs only ever touch
          # `.github/**`, so the product filters above would skip almost
          # everything. But the actions it bumps ARE the machinery these jobs
          # run on. Auto-merge waits only on required checks, so a check that
          # skips itself is a check that merges the bump untested.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # push / workflow_dispatch: the `on: paths` filter already decided.
            RUN=true
          elif [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            RUN=true
          else
            RUN="${RELEVANT:-false}"
          fi
          echo "Run tests: $RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  test-infra:
    name: "Test Infra"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: "ubuntu-latest"
    container:
      # trixie, not bookworm: the `-bookworm` python variants are frozen at uv
      # 0.9.30; the `-trixie` variants track current uv.
      image: ghcr.io/astral-sh/uv:python3.11-trixie
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Setup caching
        uses: ./.github/actions/setup-caching
        id: setup-cache
        with:
          python-version: python3.11
          cache-key-suffix: infra
      - name: Install pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "/github/home/.pulumi/bin" >> $GITHUB_PATH
      - name: Render copier instance
        if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/render-copier-instance
        with:
          copier-args: '--defaults'
      - name: Setup infra files and install dependencies
        shell: sh
        working-directory: ./rendered
        run: |
          uvx --from go-task-bin task infra:install
          cd ./infra
          uv sync --extra dev
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Run linter
        shell: sh
        working-directory: ./rendered
        run: |
          uvx --from go-task-bin task infra:lint-check
        env:
          UV_CACHE_DIR: /.uv_cache
      - name: Create pulumi stack
        working-directory: ./rendered/infra
        run: |
          pulumi login --local
          pulumi stack init -s organization/unittest/unittest
        env:
          PULUMI_CONFIG_PASSPHRASE: "123"
      - name: Run unit tests
        shell: sh
        working-directory: ./rendered
        run: |
          uvx --from go-task-bin task infra:test-coverage
        env:
          UV_CACHE_DIR: /.uv_cache
          PULUMI_CONFIG_PASSPHRASE: "123"

  infra-gate:
    name: "Infra CI"
    # The stable, always-reporting context to mark required on `main`. Matrix
    # job names are unusable for that (they multiply, and they change whenever
    # the matrix does), and a skipped job reports nothing to require. This one
    # always runs: it passes when the work above passed or was legitimately
    # skipped, and fails when any of it failed or was cancelled.
    needs: [changes, test-infra]
    if: always()
    runs-on: "ubuntu-latest"
    steps:
      - name: Check upstream results
        shell: bash
        env:
          RESULTS: "${{ needs.changes.result }} ${{ needs.test-infra.result }}"
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "An upstream job finished with: $result"; exit 1 ;;
            esac
          done
          echo "All upstream jobs passed or were skipped."
