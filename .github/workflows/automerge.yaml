name: Automerge

# ─────────────────────────────────────────────────────────────────────────────
# Automerge
# Approves and merges Dependabot's grouped github-actions bump once every check
# in `.github/automerge.yaml` has reported green. Replaces the older
# dependabot-automerge.yaml, which asked GitHub's native auto-merge to do it.
#
# Why that was replaced: ruleset bypass resolves against whoever PERFORMS the
# merge. `gh pr merge --auto` merges as `github-actions[bot]`, which holds no
# bypass and cannot be given one (bypass actors must be Apps installed on the
# repo, and Actions is built in). So the PR would sit waiting on a code-owner
# review forever, with auto-merge armed and nothing saying why. This merges as
# the `dr-auto-merge` App instead, which does hold the bypass on the
# `main review` ruleset.
#
# It also adds what native auto-merge cannot do: native auto-merge waits only
# on REQUIRED checks, and `main` requires exactly one context here. See
# `expected_checks` in `.github/automerge.yaml` for the rest of the bar.
# ─────────────────────────────────────────────────────────────────────────────
# MODE:
#   report  - comments a verdict, approves and merges nothing.
#   approve - also approves. The merge is still a human click.
#   merge   - also approves AND merges.
#
# Landed directly in `merge`, after af-component-evaluation validated the same
# workflow through report mode on 2026-09-11. Even in `merge` the approval and
# the merge happen on DIFFERENT polls, so there is always a window of roughly
# one poll interval to intervene. Dropping back to `report` is a one-word
# revert if anything looks wrong.
# ─────────────────────────────────────────────────────────────────────────────
# A cron, not `pull_request`: a Dependabot `pull_request` event cannot read this
# repo's Actions secrets, so the App key would arrive empty. Polling also
# self-heals when GitHub drops a workflow dispatch, and makes "wait for the
# checks to finish" free.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  automerge:
    uses: datarobot-oss/github-actions/.github/workflows/automerge.yaml@0.0.28
    with:
      # Public metadata, not a secret: `dr-auto-merge`.
      app_id: '4912188'
      mode: 'merge'
    secrets:
      app_private_key: ${{ secrets.DR_AUTO_MERGE_PRIVATE_KEY }}
    permissions:
      contents: read
